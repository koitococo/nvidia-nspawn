[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-nspawn"
version = "0.1.0"
description = "Live NVIDIA device injection for systemd-nspawn"
requires-python = ">=3.11"

[project.scripts]
nvidia-nspawn = "nvidia_nspawn.cli:main"

[tool.setuptools.packages.find]
include = ["nvidia_nspawn*"]
